<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
</head>
<body>
    
    <h1>Pesquisa de Usuário</h1>

    <form action="" method="get">

        <fieldset>
            <label for="nomeUsuario">Nome do usuário:</label>
            <input 
                type="text"
                name="nomeUsuario" 
                id="nomeUsuarioId" required>
            <br>
            <label for="idadeUsuario">Idade do usuário:</label>
            <input 
                type="number" 
                name="idadeUsuario" 
                id="idadeUsuarioId"
                min="12" max="100" required>
            <br>
            <label for="dtNascimento">Data de nascimento:</label>
            <input type="date" name="dtNascimento" id="dtNascimentoId">
            <br>
            <label for="emailUsuario">Email:</label>
            <input type="email" name="emailUsuario" id="emailUsuario">
        </fieldset>
        

        <button type="submit">Enviar dados</button>
        <button type="reset">Limpar</button>

    </form>

</body>
</html>
